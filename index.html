<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gut log">
<meta name="format-detection" content="telephone=no">
<title>Gut log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
<script>
  // ไม่ใช้ service worker ตอนทดสอบในเครื่อง จะได้เห็นโค้ดล่าสุดเสมอ
  if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    // มีเวอร์ชันใหม่ติดตั้งเสร็จ → โหลดหน้าใหม่ให้เลย (ไม่ทำตอนติดตั้งครั้งแรก)
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      // กำลังกรอกบันทึกหรือมีกล่องถามค้างอยู่ → ไม่รีโหลด ใช้เวอร์ชันใหม่ตอนเปิดครั้งหน้า
      if (document.querySelector('.sheet, .dialog-layer, input:focus')) return;
      reloading = true;
      location.reload();
    });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
    // กลับมาเปิดแอปที่ค้างไว้ → เช็กเวอร์ชันใหม่
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
    });
  }
</script>
</body>
</html>
